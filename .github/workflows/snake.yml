name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: Bia-Gs
          outputs: |
            dist/snake.svg?color_snake=FF00F6&color_dots=#000000,#050505,#0a0a0a,#111111,#1a1a1a

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
